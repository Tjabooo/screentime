[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "screentime"
version = "0.1.0"
description = "iPhone-style Screen Time for Hyprland: a tiny daemon that tracks app use, pickups and idle time."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Tjabooo" }]
keywords = ["hyprland", "wayland", "screen-time", "productivity"]
classifiers = ["Environment :: No Input/Output (Daemon)", "Operating System :: POSIX :: Linux", "Programming Language :: Python :: 3"]
dependencies = []

[project.scripts]
screentime = "screentime.cli:main"

[project.urls]
Homepage = "https://github.com/Tjabooo/screentime"

[tool.setuptools]
packages = ["screentime"]

[tool.pytest.ini_options]
pythonpath = ["."]
