[package]
name = "screentime"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "iPhone-style Screen Time for Hyprland: a tiny daemon that tracks app use, pickups and idle time."
license = "MIT"
repository = "https://github.com/Tjabooo/screentime"
readme = "README.md"
keywords = ["hyprland", "wayland", "screen-time", "productivity"]
categories = ["command-line-utilities"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
libc = "0.2"
rusqlite = { version = "0.41", features = ["bundled"] }
serde_json = { version = "1", features = ["preserve_order"] }
signal-hook = "0.4"
toml = { version = "1", default-features = false, features = ["parse", "preserve_order", "serde"] }
ureq = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
